[project]
name = "bg-ng-local-viewer"
version = "0.1.0"
description = "View locally installed BrainGlobe atlases in Neuroglancer"
requires-python = ">=3.10"
dependencies = ["numpy", "s3fs", "zarr>=3"]

[project.scripts]
bg-ng-viewer = "bg_ng_viewer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bg_ng_viewer"]
