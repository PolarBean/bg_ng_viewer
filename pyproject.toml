[project]
name = "bg-ng-local-viewer"
version = "0.2.0"
description = "Generate and serve BrainGlobe atlas states for Neuroglancer"
requires-python = ">=3.10"
dependencies = ["numpy", "s3fs", "zstandard"]

[project.scripts]
bg-ng-viewer = "bg_ng_viewer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bg_ng_viewer"]

[tool.pytest.ini_options]
pythonpath = ["."]
